name: TLPT Data Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "news-data.json"
      - "FELT-WHISPERS-WRITING-GUIDE.md"
      - "audit-code-hygiene.py"
      - "maintenance-baseline.json"
      - "MAINTENANCE-RUNBOOK.md"
      - "downloads/**"
      - "vendor/**"
      - "lily-site/**"
      - "marchand-vault/**"
      - "images/**"
      - "media/**"
      - "audio/**"
      - "fonts/**"
      - "*.png"
      - "CNAME"
      - ".nojekyll"
      - "robots.txt"
      - "sitemap.xml"
      - "data/league-config.json"
      - "data/featured-cards.json"
      - "data/player-metadata.json"
      - "data/events.json"
      - "data/event-financials.json"
      - "data/event-formats.json"
      - "data/marchand-*.json"
      - "data/raw/events/**"
      - ".github/workflows/**"
      - "requirements-quality.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - "templates/site/**"
      - "site-src/**"
      - "tests/visual/**"
      - "!images/fw/gallery-manifest.json"
  workflow_dispatch:

# One generated-data/manifest writer and one ordered production publisher.
concurrency:
  group: tlpt-data-pipeline-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      built_sha: ${{ steps.publish.outputs.built_sha }}
      ready: ${{ steps.publish.outputs.ready }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install quality-gate dependencies
        id: python_deps
        timeout-minutes: 3
        run: python -m pip install --requirement requirements-quality.txt
      - name: Install locked browser test tools
        id: node_tools
        timeout-minutes: 3
        run: |
          npm install --global pnpm@11.25.0
      - name: Restore locked package downloads
        uses: actions/cache@v6.1.0
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-24.04-${{ runner.arch }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked packages
        id: node_deps
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --store-dir .pnpm-store
      - name: Prepare pinned browser environment (download retries only)
        id: browser_environment
        timeout-minutes: 11
        run: python scripts/browser-ci.py prepare
      - name: Build all TLPT generated data
        run: bash scripts/run-data-build.sh
      - name: Build gallery in the same release
        run: node scripts/build-gallery-manifest.mjs
      - name: Run complete TLPT quality gates
        id: quality
        run: bash scripts/run-quality-gates.sh
      - name: Package public files only
        run: python scripts/package-site.py
      - name: Test the actual publishable artifact on desktop, tablet and mobile
        id: browser_checks
        timeout-minutes: 12
        run: python scripts/browser-ci.py functional
      - name: Compare approved visual baselines
        id: visual_checks
        timeout-minutes: 10
        run: python scripts/browser-ci.py visual
      - name: Explain release failure category
        if: failure()
        env:
          PYTHON_DEPS: ${{ steps.python_deps.outcome }}
          NODE_TOOLS: ${{ steps.node_tools.outcome }}
          NODE_DEPS: ${{ steps.node_deps.outcome }}
          BROWSER_ENVIRONMENT: ${{ steps.browser_environment.outcome }}
        run: python scripts/report-release-failure.py
      - name: Preserve visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-failure-main
          path: browser-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit tested generated outputs without rebasing or rebuilding
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "A newer source revision exists; this obsolete release will not publish." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parsed/events/
          git add data/generated/event-history.json
          git add data/generated/stat-events.json data/generated/site-data.json
          git add data/generated/validation-report.json data/generated/integrity-report.json
          git add data/generated/knockouts-generated.json data/generated/knockouts.json
          git add knockouts.json knockout-events-full.json knockout-name-map-full.json
          git add images/fw/gallery-manifest.json
          git add app.js style.css
          # These regions/versions were generated and tested with this artifact.
          python -c 'import subprocess; from scripts.site_components import PAGES; subprocess.run(["git", "add", "--", *PAGES], check=True)'
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild tested TLPT data and gallery"
            git push origin HEAD:main
          fi
          echo "built_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Retain tested public artifact
        if: steps.publish.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site-release
          retention-days: 7

  deploy:
    name: Publish tested website
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject an obsolete release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.built_sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$CURRENT_SHA" = "$EXPECTED_SHA"
      - name: Deploy only the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public release receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://tlpt.org/release.json?revision=$SOURCE_SHA" | python -c 'import json,os,sys; assert json.load(sys.stdin)["sourceRevision"] == os.environ["SOURCE_SHA"]'; then
              echo "Verified https://tlpt.org at $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Public release verification failed" >&2
          exit 1
