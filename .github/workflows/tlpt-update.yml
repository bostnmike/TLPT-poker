name: TLPT Data Pipeline

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      # Union of site-quality and data inputs: every main quality check waits
      # for this serialized rebuild instead of racing it in another workflow.
      - "*.html"
      - "*.css"
      - "*.js"
      - "news-data.json"
      - "FELT-WHISPERS-WRITING-GUIDE.md"
      - "audit-code-hygiene.py"
      - "maintenance-baseline.json"
      - "MAINTENANCE-RUNBOOK.md"
      - "downloads/**"
      - "vendor/pdfjs/**"
      - "lily-site/**"
      - "data/league-config.json"
      - "data/featured-cards.json"
      - ".github/workflows/**"
      - "data/events.json"
      - "data/player-metadata.json"
      - "data/event-financials.json"
      - "data/raw/events/**"
      - "requirements-quality.txt"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: tlpt-data-pipeline-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      built_sha: ${{ steps.publish.outputs.built_sha }}

    steps:
      # -----------------------------------------
      # 🧾 Checkout repo
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 🐍 Setup Python
      # -----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install quality-gate dependencies
        run: python -m pip install --requirement requirements-quality.txt

      # -----------------------------------------
      # 🏗️ Run authoritative data build
      # -----------------------------------------
      - name: Build all TLPT generated data
        run: bash scripts/run-data-build.sh

      # -----------------------------------------
      # ✅ Run complete quality gates
      # -----------------------------------------
      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh

      # -----------------------------------------
      # 💾 Commit + push generated data
      # -----------------------------------------
      - name: Commit updated data
        id: publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "🔄 Syncing with latest main before committing generated files..."
          git fetch origin main
          git reset --hard origin/main

          echo "🏗️ Re-running authoritative data build after sync..."
          bash scripts/run-data-build.sh

          echo "✅ Running complete TLPT quality gates..."
          bash scripts/run-quality-gates.sh

          echo "📦 Staging generated outputs..."
          git add data/parsed/events/
          git add data/generated/event-history.json
          git add data/generated/site-data.json
          git add data/generated/validation-report.json
          git add data/generated/integrity-report.json
          git add data/generated/knockouts-generated.json
          git add data/generated/knockouts.json
          git add knockouts.json
          git add knockout-events-full.json
          git add knockout-name-map-full.json

          if git diff --cached --quiet; then
            echo "✅ No generated data changes to commit."
            echo "built_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "🔄 TLPT auto-update (full rebuild)"

          echo "🚀 Pushing generated data..."
          git push origin HEAD:main
          echo "built_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: TLPT Site Quality Gate
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/site-quality.yml
    with:
      built_sha: ${{ needs.build.outputs.built_sha }}
