name: Verify Automatic Asset Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install quality dependencies
        run: python -m pip install --requirement requirements-quality.txt
      - name: Rebuild deterministic markup and versions
        run: python scripts/build-site-shell.py
      - name: Verify generated regions and hashes
        run: python scripts/build-site-shell.py --check
      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh
      # Diagnostic only. Main's single gated publisher owns generated writes.
