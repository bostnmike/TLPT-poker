name: TLPT Site Quality Gate

on:
  # Main publication is gated inside tlpt-update.yml; this is independent validation.
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "news-data.json"
      - "FELT-WHISPERS-WRITING-GUIDE.md"
      - "audit-code-hygiene.py"
      - "maintenance-baseline.json"
      - "MAINTENANCE-RUNBOOK.md"
      - "downloads/**"
      - "vendor/**"
      - "lily-site/**"
      - "marchand-vault/**"
      - "images/**"
      - "media/**"
      - "audio/**"
      - "fonts/**"
      - "*.png"
      - "CNAME"
      - ".nojekyll"
      - "robots.txt"
      - "sitemap.xml"
      - "data/league-config.json"
      - "data/featured-cards.json"
      - "data/player-metadata.json"
      - "data/events.json"
      - "data/event-financials.json"
      - "data/event-formats.json"
      - "data/marchand-*.json"
      - "data/raw/events/**"
      - ".github/workflows/**"
      - "requirements-quality.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - "templates/site/**"
      - "site-src/**"
      - "tests/visual/**"
      - "!images/fw/gallery-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlpt-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Never move to a newer main commit while checking a completed rebuild.
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install quality-gate dependencies
        timeout-minutes: 3
        run: python -m pip install --requirement requirements-quality.txt

      - name: Rebuild data for independent PR or manual checks
        run: bash scripts/run-data-build.sh

      - name: Generate gallery manifest
        run: node scripts/build-gallery-manifest.mjs
      - name: Install locked browser test tools
        timeout-minutes: 3
        run: |
          npm install --global pnpm@11.25.0
      - name: Restore locked package downloads
        uses: actions/cache@v6.1.0
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-24.04-${{ runner.arch }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked packages
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --store-dir .pnpm-store
      - name: Install headless browser and operating-system dependencies
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh

      - name: Package and test the publishable artifact
        timeout-minutes: 12
        run: |
          python scripts/package-site.py
          node scripts/run-browser-gates.cjs
      - name: Compare approved visual baselines
        timeout-minutes: 10
        run: pnpm test:visual
      - name: Preserve visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-failure-pr
          path: browser-results/
          retention-days: 14
          if-no-files-found: ignore
