name: TLPT Site Quality Gate

on:
  push:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "news-data.json"
      - "TWTW-WRITING-GUIDE.md"
      - "audit-code-hygiene.py"
      - "maintenance-baseline.json"
      - "MAINTENANCE-RUNBOOK.md"
      - "scripts/**"
      - "data/league-config.json"
      - "data/player-metadata.json"
      - "data/featured-cards.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "news-data.json"
      - "TWTW-WRITING-GUIDE.md"
      - "audit-code-hygiene.py"
      - "maintenance-baseline.json"
      - "MAINTENANCE-RUNBOOK.md"
      - "scripts/**"
      - "data/league-config.json"
      - "data/player-metadata.json"
      - "data/featured-cards.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tlpt-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.ref == 'refs/heads/maintenance/twtw-four-section-layout-20260906'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Align two News audit constants and restore normal read-only workflow
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('scripts/audit-code-hygiene.py')
          original = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          assert sha == '5fdbb34db0a0d286f7afdfe7f382127bf43913c9', 'Audit source changed; refusing an unreviewed patch'
          text = original.decode('utf-8')
          edits = {
              'Read The Week That Was for TLPT Poker League event recaps, featured stories, spotlights, and quick hits.': 'Read The Week That Was for TLPT Poker League event recaps, game spotlights, numbers that matter, and host roasts.',
              'EXPECTED_NEWS_SCRIPT = "news-render.js?v=20260905-1"': 'EXPECTED_NEWS_SCRIPT = "news-render.js?v=20260906-1"',
          }
          for before, after in edits.items():
              assert text.count(before) == 1, 'Expected exactly one matching audit constant'
              text = text.replace(before, after, 1)
          p.write_bytes(text.encode('utf-8'))
          print('Updated only the News meta-description and script-version contract constants.')
          PY
          git show ce3c48e229d01dac22649a7cec2436e8c1444553:.github/workflows/site-quality.yml > .github/workflows/site-quality.yml
          git diff --stat

      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh

      - name: Commit validated constants and restored workflow to the test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-code-hygiene.py .github/workflows/site-quality.yml
          git commit -m "Align News audit contracts and restore read-only quality workflow"
          git push origin HEAD:maintenance/twtw-four-section-layout-20260906
