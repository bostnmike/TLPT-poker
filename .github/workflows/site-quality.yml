name: TLPT Site Quality Gate

on:
  push:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/**"
      - "data/league-config.json"
      - "data/player-metadata.json"
      - "data/featured-cards.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/**"
      - "data/league-config.json"
      - "data/player-metadata.json"
      - "data/featured-cards.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlpt-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh
