name: Validate March 28 Host Roast insertion

on:
  push:
    branches:
      - maintenance/twtw-march28-host-roast-20260906
    paths:
      - .github/workflows/twtw-march28-host-roast.yml

permissions:
  contents: write

jobs:
  insert-roast:
    if: github.repository == 'bostnmike/TLPT-poker' && github.ref == 'refs/heads/maintenance/twtw-march28-host-roast-20260906'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Insert only the requested roast and validate complete JSON
        run: |
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import re
          from pathlib import Path

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate JSON key: ' + key)
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError('Non-JSON constant: ' + value)

          def parse(text):
              return json.loads(text, object_pairs_hook=unique_object, parse_constant=reject_constant)

          path = Path('news-data.json')
          original_bytes = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(original_bytes)).encode() + b'\0' + original_bytes).hexdigest()
          assert blob == '2d4f205a88695fd59098a5436b27733a13c940aa', 'Source changed; refusing an unreviewed edit'
          original = original_bytes.decode('utf-8')
          data = parse(original)
          target_id = 'week-03-28-2026'
          matches = [i for i, story in enumerate(data['weeks']) if story.get('id') == target_id]
          assert len(matches) == 1, 'Expected exactly one March 28 story'
          index = matches[0]
          target = data['weeks'][index]
          assert target['eventName'] == 'March Sadness Part II | 9-Max'
          assert 'roastHtml' not in target, 'Existing roast must not be overwritten'
          assert len(data['weeks']) == 52
          assert [story['id'] for story in data['weeks'] if story.get('featured') is True] == ['week-09-05-2026']

          roast = "<p>March Sadness Part II gave BostnMike third place and another chance to confuse making the money with being the main character. Red removed him before heads-up, but the Commissioner still gets to write the recap. When you cannot survive the final cut, owning the editing room is the next best thing.</p>"
          marker = '"id": "' + target_id + '"'
          assert original.count(marker) == 1
          start = original.index(marker)
          stop = original.index('"id": "', start + len(marker))
          relative = re.search(r'(?m)^([ \t]*)"numbersThatMatter": \[', original[start:stop])
          assert relative, 'Cannot locate the target insertion point'
          position = start + relative.start()
          addition = relative.group(1) + '"roastHtml": ' + json.dumps(roast, ensure_ascii=False) + ',\n'
          updated = original[:position] + addition + original[position:]
          parsed = parse(updated)
          expected = copy.deepcopy(data)
          expected['weeks'][index]['roastHtml'] = roast
          assert parsed == expected, 'Unexpected data change'
          assert updated.count('\n') == original.count('\n') + 1
          assert updated[:position] + updated[position + len(addition):] == original
          assert len({story['id'] for story in parsed['weeks']}) == 52
          path.write_bytes(updated.encode('utf-8'))
          assert parse(path.read_text(encoding='utf-8')) == expected
          print('PASS: exactly one roastHtml field added to March 28; all 52 stories, flags, existing values and other bytes preserved.')
          PY
      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh
      - name: Save validated data on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- news-data.json
          test "$(git diff --cached --name-only)" = 'news-data.json'
          git diff --cached --stat
          git commit -m 'Add requested Host Roast to March Sadness Part II (March 28, 2026)'
          git push origin HEAD:maintenance/twtw-march28-host-roast-20260906
          git rev-parse HEAD:news-data.json
