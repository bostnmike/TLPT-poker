name: Registration hosting checks
on:
  push:
    paths: ['registration-domain/**', 'register.html', '.github/workflows/registration-checks.yml']
  pull_request:
    paths: ['registration-domain/**', 'register.html', '.github/workflows/registration-checks.yml']
jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test registration-domain/tests/*.test.mjs
      - run: node scripts/test-register-page.mjs
