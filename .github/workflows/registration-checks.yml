name: TLPT Registration Quality Gate
on:
  push:
    paths:
      - 'registration-domain/**'
      - 'register.html'
      - 'register.js'
      - 'register.css'
      - 'scripts/test-register-page.mjs'
      - '.github/workflows/registration-checks.yml'
  pull_request:
    paths:
      - 'registration-domain/**'
      - 'register.html'
      - 'register.js'
      - 'register.css'
      - 'scripts/test-register-page.mjs'
      - '.github/workflows/registration-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test registration-domain/tests/*.test.mjs
      - run: node scripts/test-register-page.mjs
