name: TLPT RSVP checks
on:
  pull_request:
    paths: ['rsvp/**', 'scripts/test-recovery.py', '.github/workflows/rsvp-checks.yml']
  push:
    branches: [main]
    paths: ['rsvp/**', 'scripts/test-recovery.py', '.github/workflows/rsvp-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: rsvp
      - run: node --test rsvp/tests/*.test.mjs
      - run: python scripts/test-recovery.py --product rsvp
      - run: node rsvp/scripts/test-integration.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
      - run: node rsvp/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config rsvp/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
