name: Check Gallery Manifest (manual diagnostic)

# Production generation is owned by TLPT Data Pipeline. This never writes main.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the published manifest matches its posters
        run: |
          node scripts/build-gallery-manifest.mjs
          git diff --exit-code -- images/fw/gallery-manifest.json
