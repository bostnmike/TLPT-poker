name: TLPT Cashier Quality Gate
on:
  push:
    paths: ["cashier/**", ".github/workflows/cashier-checks.yml"]
  pull_request:
    paths: ["cashier/**", ".github/workflows/cashier-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test:integration
      - name: Validate Worker bundle without publishing
        run: pnpm exec wrangler deploy --dry-run --env="" --outdir .wrangler/dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
