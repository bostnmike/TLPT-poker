name: Validate TWTW Felt Whispers heading migration

on:
  push:
    branches:
      - maintenance/twtw-felt-whispers-heading-20260906
    paths:
      - .github/workflows/twtw-felt-whispers-heading.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Apply targeted migration
        run: python3 scripts/twtw-felt-whispers-migrate.py

      - name: Run complete TLPT quality gates
        run: |
          git diff --check
          bash scripts/run-quality-gates.sh

      - name: Save validated changes on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-render.js news.html news-data.json TWTW-WRITING-GUIDE.md scripts/test-news-layout.mjs scripts/audit-code-hygiene.py
          git commit -m "Rename TWTW narrative section to Felt Whispers"
          git push origin HEAD:maintenance/twtw-felt-whispers-heading-20260906
