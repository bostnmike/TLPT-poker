name: Apply Zero-Game Metric Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tlpt-zero-game-metric-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply surgical source patch
        run: |
          python scripts/apply-zero-game-metric-fix.py
          python -m py_compile scripts/build-site-data.py
          python -m py_compile scripts/audit-site-integrity.py

      - name: Rebuild all generated data
        run: bash scripts/run-data-build.sh

      - name: Run complete TLPT quality gates
        run: bash scripts/run-quality-gates.sh

      - name: Verify zero-game output directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/generated/site-data.json').read_text(encoding='utf-8'))
          zero_players = [
              player for player in data.get('players', [])
              if int(player.get('buyIns', 0) or 0) == 0
          ]
          keys = (
              'roi', 'cashRate', 'bubbleRate', 'hitRate',
              'expectedProfit', 'luckIndex',
              'clutchRaw', 'aggressionRaw', 'survivorRaw',
              'tiltScoreDirect', 'tiltIndex', 'trueSkillScore',
              'roi_norm', 'luckIndex_norm', 'clutchRaw_norm',
              'aggressionRaw_norm', 'survivorRaw_norm',
              'clutchIndex', 'aggressionIndex', 'survivorIndex',
          )
          failures = []
          for player in zero_players:
              for key in keys:
                  if abs(float(player.get(key, 0) or 0)) > 1e-9:
                      failures.append(f"{player.get('slug')}: {key}={player.get(key)}")
          if failures:
              raise SystemExit('Zero-game validation failed:\n' + '\n'.join(failures))
          print(f'PASS: {len(zero_players)} zero-game player(s) have all derived career metrics at zero')
          PY

      - name: Commit permanent fix and remove one-time helper
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'

          git rm scripts/apply-zero-game-metric-fix.py
          git rm .github/workflows/apply-zero-game-metric-fix.yml

          git add scripts/build-site-data.py
          git add scripts/audit-site-integrity.py
          git add data/parsed/events/
          git add data/generated/site-data.json
          git add data/generated/validation-report.json
          git add data/generated/integrity-report.json
          git add data/generated/knockouts-generated.json
          git add data/generated/knockouts.json
          git add knockouts.json
          git add knockout-events-full.json
          git add knockout-name-map-full.json

          git commit -m 'Fix zero-game player career metrics'
          git push origin HEAD:main
